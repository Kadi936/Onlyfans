<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 جاري تجهيز المحتوى...</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            direction: rtl;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .loader-text {
            font-size: 18px;
            margin-bottom: 25px;
            color: #cbd5e1;
        }
        /* زر صريح يضغط عليه الزائر لكي يسمح المتصفح بالتوجيه فوراً */
        .action-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #ff0355;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 3, 85, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader-text">تم فحص الرابط بنجاح وأصبح جاهزاً للعرض.</div>
        <a href="#" class="action-btn" id="redirectLink">إضغط هنا للمتابعة للمحتوى</a>
    </div>

    <script>
        // رابط مدونتك المشفر الثابت
        var encryptedDestination = "aHR0cHM6by91ZWF1dG1vbmx5ZmZucy5ibG9nc3BvdC5jb20=";

        document.getElementById('redirectLink').addEventListener('click', function(event) {
            // منع السلوك الافتراضي للرابط الفارغ
            event.preventDefault(); 
            
            try {
                var realUrl = atob(encryptedDestination);
                // التوجيه الفوري (المتصفح سيسمح به لأن الزائر ضغط بنفسه على الزر)
                window.location.href = realUrl;
            } catch(e) {
                // تجاوز الأخطاء
            }
        });
    </script>

</body>
</html>
