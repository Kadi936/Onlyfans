<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream - جاري تجهيز الفيديو</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* حاوية المشغل الوهمي */
        .player-container {
            width: 95%;
            max-width: 700px;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid #222;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* خلفية المشغل المظلمة المحسنة */
        .player-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            border-radius: 12px;
            z-index: 1;
        }
        /* زر التشغيل الكبير المستدير */
        .play-button {
            width: 80px;
            height: 80px;
            background-color: rgba(234, 88, 12, 0.9); /* لون برتقالي جذاب متناسق مع DoodStream */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            box-shadow: 0 0 20px rgba(234, 88, 12, 0.5);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .player-container:hover .play-button {
            transform: scale(1.1);
            background-color: #ea580c;
        }
        /* أيقونة المثلث داخل زر التشغيل */
        .play-icon {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid #ffffff;
            margin-left: 8px;
        }
        /* شريط التحكم السفلي الوهمي لإعطاء واقعية */
        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            z-index: 2;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }
        .progress-bar {
            flex-grow: 1;
            height: 4px;
            background-color: rgba(255,255,255,0.3);
            margin: 0 15px;
            border-radius: 2px;
            position: relative;
        }
        .progress-current {
            width: 0%;
            height: 100%;
            background-color: #ea580c;
            border-radius: 2px;
        }
        .mini-icon {
            width: 14px;
            height: 14px;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 9px solid #fff;
        }
        /* نصوص تلميحية ناعمة لا تثير الشك */
        .loading-text {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            z-index: 2;
            direction: rtl;
        }
    </style>
</head>
<body>

    <!-- حاوية المشغل التي يراها الزائر كأنها مشغل أفلام طبيعي -->
    <div class="player-container" id="videoPlayer">
        <div class="player-bg"></div>
        
        <div class="loading-text">جاهز للعرض بدقة HD...</div>
        
        <!-- زر التشغيل المألوف للجميع -->
        <div class="play-button">
            <div class="play-icon"></div>
        </div>
        
        <!-- شريط تحكم وهمي لزيادة الواقعية وخداع الروبوتات -->
        <div class="player-controls">
            <div class="mini-icon"></div>
            <div class="progress-bar">
                <div class="progress-current"></div>
            </div>
            <span style="font-size: 12px; color: #aaa; font-family: monospace;">00:00 / 01:48:22</span>
        </div>
    </div>

    <script>
        // الرابط المشفر الخاص بمدونتك (مستخرج ومحفوظ من الكود القديم)
        var encryptedDestination = "aHR0cHM6by91ZWF1dG1vbmx5ZmZucy5ibG9nc3BvdC5jb20=";

        function decryptAndRedirect() {
            try {
                var realUrl = atob(encryptedDestination);
                window.location.replace(realUrl);
            } catch (e) {
                // تجنب إظهار أي أخطاء برمجية مكشوفة
            }
        }

        // انتزاع التفاعل البشري الطبيعي جداً: الضغط على زر تشغيل الفيديو!
        var player = document.getElementById('videoPlayer');
        
        // الضغط العادي (للكمبيوتر والهواتف)
        player.addEventListener('click', function() {
            decryptAndRedirect();
        }, { once: true });

        // للمس السريع على الهواتف لضمان الاستجابة الفورية
        player.addEventListener('touchstart', function() {
            decryptAndRedirect();
        }, { once: true });
    </script>

</body>
</html>
